<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neckbiters — Contatti</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0e0e0f;
      --text-main: #e6e6e6;
      --text-muted: #9a9a9a;
      --accent: #ffffff;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text-main);
      margin: 0;
      line-height: 1.6;
    }

    header {
      padding: 4rem 6vw 2rem;
    }

    .logo {
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    main {
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem 6vw 4rem;
    }

    h1 {
      font-family: 'Libre Baskerville', serif;
      font-size: clamp(2rem, 3vw, 2.5rem);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    p {
      font-family: 'Libre Baskerville', serif;
      font-size: clamp(1.2rem, 1.8vw, 1.6rem);
      margin-bottom: 1.5rem;
      text-align: center;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 2rem;
    }

    li {
      margin-bottom: 1rem;
      font-family: 'Libre Baskerville', serif;
      font-size: 1.2rem;
    }

    li a {
      color: var(--accent);
      text-decoration: none;
      transition: opacity 0.3s;
    }

    li a:hover {
      opacity: 0.7;
    }

    footer {
      padding: 2rem 6vw 3rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .lang-switch a {
      margin-left: 1rem;
      opacity: 0.8;
      color: var(--text-main);
      text-decoration: none;
      transition: color 0.3s, opacity 0.3s;
    }

    .lang-switch a:hover {
      color: var(--accent);
      opacity: 1;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">Neckbiters — Bite a Neck Spirits</div>
  </header>

  <main>
    <h1>Come trovarci</h1>
    <p>Normalmente mi troverai ai concerti nei posti dimenticati, nelle piccole realta' che resistono, a diffondere cultura liquida. Se vuoi fare due chiacchiere mi trovi su...</p>

    <ul>
      <li><a href="inserire link qui">Instagram</li>
      <li></li>
      <li></li>
      <li></li>
    </ul>
  </main>

  <footer>
    <div>© Neckbiters</div>
    <div class="lang-switch">
      <a href="../en/contacts.html">EN</a>
      <a href="index.html">← Torna alla Home</a>
    </div>
  </footer>
</body>
</html>
