<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Neckbiters — Bite a Neck Spirits</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0e0e0f;
      --bg-soft: #161618;
      --text-main: #e6e6e6;
      --text-muted: #9a9a9a;
      --accent: #ffffff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    header {
      padding: 4rem 6vw 3rem;
    }

    .logo {
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .hero {
      padding: 4rem 6vw 6rem;
      max-width: 880px;
    }

    .hero p {
      font-family: 'Libre Baskerville', serif;
      font-size: clamp(1.6rem, 2.4vw, 2.4rem);
      line-height: 1.35;
      transition: color 0.3s ease, transform 0.3s ease;
      cursor: default;
    }

    .hero p:hover {
      color: #ffffff;
      transform: translateX(4px);
    }

    .hero p + p {
      margin-top: 1.5rem;
    }

    nav {
      padding: 0 6vw 6rem;
      display: grid;
      gap: 1.5rem;
      max-width: 420px;
    }

    .nav-item {
      font-family: 'Libre Baskerville', serif;
      font-size: 1.3rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: relative;
      cursor: pointer;
      transition: border-color 0.3s ease, transform 0.2s ease;
    }

    .nav-item::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 0%;
      height: 1px;
      background: var(--text-main);
      transition: width 0.3s ease;
    }

    .nav-item:hover {
      border-color: rgba(255,255,255,0.4);
      transform: translateX(3px);
    }

    .nav-item:hover::after {
      width: 100%;
    }

    footer {
      padding: 4rem 6vw 3rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .lang-switch a {
      margin-left: 1rem;
      opacity: 0.6;
      color: var(--text-main);
      text-decoration: none;
      transition: opacity 0.3s ease;
    }

    .lang-switch a:hover {
      opacity: 1;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">Neckbiters — Bite a Neck Spirits</div>
  </header>

  <main>
    <section class="hero">
      <p>
        Neckbiters nasce dalla passione.<br>
        Frutta cresciuta nella natura.
      </p>

      <p>
        Ogni liquore è un’infusione lenta, fatta a mano,<br>
        dove il tempo non è un costo, bensì un ingrediente.
      </p>
    </section>

    <nav>
      <a class="nav-item" href="storia.html">Storia</a>
      <a class="nav-item" href="liquori.html">Liquori</a>
      <a class="nav-item" href="contatti.html">Contatti</a>
      <a class="nav-item" href="ringraziamenti.html">Ringraziamenti</a>
    </nav>
  </main>

  <footer>
    <div>© Neckbiters</div>
    <div class="lang-switch">
      <span>IT</span>
      <a href="../en/index.html">EN</a>
	  <a href="privacy.html">Privacy</a>
    </div>
  </footer>

</body>
</html>
